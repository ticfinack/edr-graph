[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edr-graph"
version = "0.1.0"
description = "Local EDR with Graph-Based Event Correlation & AI Analysis"
requires-python = ">=3.11"
dependencies = [
    "kuzu>=0.4.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "psutil>=5.9.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "structlog>=24.0.0",
    "prometheus_client>=0.20.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
    "watchdog>=4.0.0; sys_platform == 'darwin'",
    "rumps>=0.4.0; sys_platform == 'darwin'",
    "setproctitle>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pyinstaller>=6.0.0",
    "ruff>=0.4.0",
    "bandit>=1.7.0",
    "grpcio-tools>=1.60.0",
]
server = [
    "neo4j>=5.15.0",
]
windows = []
linux = []

[project.scripts]
edr-graph = "agent.main:main"
edr-watchdog = "agent.watchdog:main"

[tool.setuptools.packages.find]
include = ["agent*", "server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["agent/fleet/proto"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "A",    # builtins shadowing
    "C4",   # comprehensions
    "SIM",  # simplifications
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E741",   # ambiguous variable name
    "N802",   # function name lowercase (gRPC generated code)
    "N803",   # argument name lowercase (gRPC generated code)
    "N806",   # variable in function should be lowercase
    "UP035",  # deprecated typing imports (compatibility)
    "UP042",  # str+Enum inheritance (StrEnum requires careful migration)
    "B027",   # empty methods in ABC without @abstractmethod (intentional no-op defaults)
    "A002",   # builtin shadowing in function args (e.g. log_message format param)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]
"agent/fleet/proto/**" = ["E501", "F401", "N802", "N803", "N806"]
"server/tests/test_grpc_service.py" = ["F401"]
"server/tests/test_neo4j_client.py" = ["I001"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "agent/fleet/proto"]
skips = [
    "B101",  # assert used in non-test code (acceptable for internal checks)
    "B104",  # bind to 0.0.0.0 — intentional for dashboard server
    "B108",  # hardcoded /tmp — EDR heartbeat files
    "B110",  # try-except-pass / contextlib.suppress — idiomatic Python
    "B310",  # url open — IOC database updates
    "B324",  # weak hash — MD5/SHA1 used for JA3 fingerprinting, not security
    "B404",  # subprocess import — EDR agent legitimately needs subprocess
    "B603",  # subprocess call without shell=True check
    "B607",  # partial executable path in subprocess
    "B608",  # SQL string construction — graph queries with safe internal values
]
