services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/changeme
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  fleet-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "50051:50051"  # gRPC (agent connections)
      - "8080:8080"    # Fleet dashboard
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=changeme
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SETTINGS_DB_PATH=/app/data/settings.db
      # Uncomment for mTLS:
      # - TLS_CA_CERT=/app/certs/ca.pem
      # - TLS_SERVER_CERT=/app/certs/server.pem
      # - TLS_SERVER_KEY=/app/certs/server-key.pem
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./certs:/app/certs:ro
      - fleet_settings:/app/data

volumes:
  neo4j_data:
  neo4j_logs:
  fleet_settings:
